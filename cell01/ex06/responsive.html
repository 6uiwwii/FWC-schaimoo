<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1.6</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }
        table {
            width: 100%;
            height: 100vh;
            border-collapse: collapse;
            table-layout: fixed;
        }
        td {
            text-align: center;
            font-size: 2vw;
            font-family: sans-serif;
            font-weight: bold;
        }
        .first-cell {
            background-color: #1d3d6d;
            color: white;
        }
        .second-cell {
            background-color: #ab0b0b;
            color: white;
        }

        @media (max-width: 600px) {
            tr {
                display: flex;
                flex-direction: column;
                height: 100vh;
            }
            td {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 100%;
                height: 50%;
                font-size: 5vw;
            }
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="first-cell">First cell</td>
            <td class="second-cell">Second cell</td>
        </tr>
    </table>

</body>
</html>
