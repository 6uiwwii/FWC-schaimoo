<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basics</title>
    <style>
        body {
            background-color: pink;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        h1 {
            color: white;
            text-align: center;
        }
        .shop-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 60px;
            margin: 40px 0;
        }
        .shop-item {
            text-align: center;
        }
        .shop-item img {
            width: 400px;
            height: 400px;
            object-fit: contain;
            display: block;
            margin: 0 auto 10px auto;
        }
        hr {
            width: 100%;
            border: none;
            border-top: 2px solid black;
            margin-bottom: 10px;
        }
        .copyright {
            margin-top: auto;
            text-align: right;
            font-style: italic;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <h1>Shop & Order</h1>

    <div class="shop-container">
        <div class="shop-item">
            <img src="https://www.one31shop.com/img/logo/one31-logo-black.png" alt="oneD">
            <a href="https://www.one31shop.com/">OneD Shop</a>
        </div>
        <div class="shop-item">
            <img src="https://the-parq.sgp1.digitaloceanspaces.com/2021/08/02124201/LOGO-PNG-01-1-1024x1024.png" alt="naiin">
            <a href="https://www.naiin.com/?srsltid=AfmBOopUlmFTwQRl094TNIsVU2bP7ZnW1E_pngEA1zl0mpSfixLUTn4g">NaiIn</a>
        </div>
    </div>


    <div class="copyright">
        <hr>
        © schaimoo 2026
    </div>

</body>
</html>
