<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tab</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        td {
            padding: 40px;
            text-align: center;
            font-size: 20px;
            font-family: sans-serif;
            font-weight: bold;
        }
        .first-cell {
            background-color: #1d3d6d;
            color: white;
        }
        .second-cell {
            background-color: #ab0b0b;
            color: white;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="first-cell">First cell</td>
            <td class="second-cell">Second cell</td>
        </tr>
    </table>

</body>
</html>
